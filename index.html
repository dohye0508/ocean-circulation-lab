<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="수온과 염분에 따른 밀도 차가 해수의 연직 순환을 일으키는 과정을 3D 유체 시뮬레이션으로 보는 가상 실험실.">
  <title>해수의 연직 순환 실험</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/app.css?v=9">
  <script src="src/water.js?v=9" defer></script>
  <script src="src/fluid.js?v=9" defer></script>
  <script src="src/camera.js?v=9" defer></script>
  <script src="src/app.js?v=9" defer></script>
</head>
<body>
  <canvas id="scene" aria-label="수조. 드래그하면 돌려 볼 수 있습니다."></canvas>
  <p class="unsupported" id="unsupported" hidden></p>

  <aside class="panel" aria-label="실험">
    <h1>해수의 연직 순환 실험</h1>
    <nav class="tabs" aria-label="실험 선택">
      <button class="tab" data-exp="temp">수온 실험</button>
      <button class="tab" data-exp="salt">염분 실험</button>
    </nav>

    <section>
      <div class="row"><label for="tcup" data-for="temp">컵 속 물의 온도</label><label for="salinity" data-for="salt">소금물의 염분</label><output id="condOut"></output></div>
      <input type="range" id="tcup" data-for="temp" min="0" max="30" step="1">
      <input type="range" id="salinity" data-for="salt" min="0" max="100" step="5">
    </section>

    <section>
      <dl class="results">
        <div><dt>수조 물과의 밀도 차</dt><dd id="rDrho">—</dd></div>
        <div><dt>잉크 물의 움직임</dt><dd id="rSank">—</dd></div>
        <div><dt>반대편 벽까지</dt><dd id="rWall">—</dd></div>
      </dl>
    </section>

    <section>
      <div class="row"><h2>색으로 보기</h2>
        <div class="segmented" id="colorMode"><button data-mode="0">끔</button><button data-mode="2">밀도</button><button data-mode="1" id="propBtn">수온</button><button data-mode="3">흐름</button></div></div>
      <div class="legend" id="legend">
        <div class="legend-bar"></div>
        <div class="legend-scale"><span id="lgLo"></span><span id="lgMid"></span><span id="lgHi"></span></div>
      </div>
    </section>
    <footer class="player">
      <div class="progress"><div class="progress-fill" id="progress"></div></div>
      <div class="player-row">
        <button id="play" class="play-btn" aria-label="재생" title="재생 (스페이스바)">
          <svg viewBox="0 0 24 24" id="playIcon"><path class="fill" d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button id="reset" class="icon-btn" aria-label="처음부터" title="처음부터">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 3v5h5"/></svg>
        </button>
        <button id="speedBtn" class="speed-btn" title="재생 속도">5×</button>
        <output id="clock">0:00</output>
      </div>
    </footer>
  </aside>

  <section class="record" id="record" aria-label="실험 기록">
    <button class="rec-toggle" id="recToggle" aria-label="실험 기록 접기" title="접기">›</button>
    <div class="record-head">
      <h2>실험 기록</h2>
      <div class="segmented small" id="recView"><button data-v="graph" class="on">그래프</button><button data-v="table">표</button></div>
    </div>
    <div id="graphView">
      <div class="axis-switch" id="axisSwitch"><button data-x="cond" class="on">조건별</button><button data-x="rho">밀도 차로 모아 보기</button></div>
      <svg id="graph" viewBox="0 0 380 236" role="img" aria-label="퍼지는 속도 그래프"></svg>
    </div>
    <div id="tableView" hidden>
      <table class="log">
        <thead><tr><th id="logCond">조건</th><th>밀도 차</th><th>반대편까지</th><th>퍼지는 속도</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
    <div class="record-foot">
      <button id="autoRun" class="auto">여러 조건 자동 실험</button>
      <button id="clearLog" class="link">지우기</button>
    </div>
  </section>

</body>
</html>
